<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Batch Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Login screen -->
  <section id="login-view" class="login-view hidden">
    <form id="login-form" class="login-card">
      <h1>Batch Chat</h1>
      <p class="login-sub">Log in to your chat server</p>
      <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit" class="btn btn-primary">Log in</button>
      <p id="login-error" class="error-text hidden"></p>
    </form>
  </section>

  <!-- App screen -->
  <section id="app-view" class="app-view hidden">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Conversations</h2>
        <button id="new-chat-btn" class="btn btn-primary btn-small" title="New chat">+ New</button>
      </div>
      <ul id="conversation-list" class="conversation-list"></ul>
      <div class="sidebar-footer">
        <span id="server-status" class="status-dot" title="Server status"></span>
        <button id="logout-btn" class="btn btn-ghost btn-small">Log out</button>
      </div>
    </aside>

    <main class="chat-main">
      <header class="chat-header">
        <h3 id="chat-title">Select a conversation</h3>
        <div class="model-picker" id="model-picker">
          <button id="model-picker-btn" class="btn btn-ghost btn-small" title="Choose models">Models</button>
          <div id="model-dropdown" class="model-dropdown hidden">
            <p class="dropdown-hint">Send each message to these models in parallel:</p>
            <div id="model-checkboxes"></div>
            <label class="model-custom">
              Custom model:
              <input id="custom-model-input" type="text" placeholder="openai/gpt-4o-mini" />
            </label>
            <button id="add-model-btn" class="btn btn-primary btn-small">Add</button>
          </div>
        </div>
      </header>

      <div id="messages" class="messages"></div>

      <form id="chat-form" class="chat-form">
        <textarea id="chat-input" rows="3" placeholder="Write a message… (Ctrl+Enter to send)" required></textarea>
        <button type="submit" class="btn btn-primary" id="send-btn">Send</button>
      </form>
    </main>
  </section>

  <script src="app.js"></script>
</body>
</html>
