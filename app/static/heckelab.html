<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hecke Lab — flexchat.top</title>
<link rel="stylesheet" href="/vendor/katex.min.css">
<style>
  :root { --bg:#0f1420; --bg2:#171e2e; --bg3:#1f2940; --border:#2a3550; --text:#e6eaf2; --muted:#8b96ad; --accent:#4f8cff; --success:#3ddc84; --error:#ff6b6b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100vh; padding:24px; max-width:900px; margin:0 auto; }
  a { color:var(--accent); text-decoration:none; }
  header { display:flex; align-items:baseline; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
  h1 { font-size:22px; }
  .muted { color:var(--muted); }
  .card { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  select,input { background:var(--bg3); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:14px; width:100%; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .chip { background:var(--bg3); border:1px solid var(--border); color:var(--text); border-radius:999px; padding:4px 12px; font-size:13px; cursor:pointer; }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  .result { margin-top:10px; overflow-x:auto; padding:4px 0; }
  .badge { display:inline-block; background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:6px 10px; margin:4px 6px 0 0; font-size:13px; }
  .badge b { color:var(--success); }
  #error { color:var(--error); margin-top:8px; display:none; }
</style>
</head>
<body>
<header>
  <h1>Hecke Lab</h1>
  <span class="muted">exact q-expansions — no Sage, no GPL, pure Python</span>
  <a href="/" style="margin-left:auto">← flexchat</a>
</header>

<div id="gate" class="card" style="display:none">
  Sign in on the <a href="/">main page</a> first — the lab runs on your flexchat account.
</div>

<div id="lab" style="display:none">
  <div class="card">
    <div class="row">
      <div>
        <label>Form</label>
        <select id="form">
          <option value="delta">Δ — discriminant (weight 12, Ramanujan τ)</option>
          <option value="eisenstein">E_k — Eisenstein series (even weight 4–24)</option>
        </select>
      </div>
      <div id="weightBox" style="display:none">
        <label>Weight k (even, 4–24)</label>
        <input id="weight" type="number" min="4" max="24" step="2" value="4">
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <div>
        <label>Hecke operator T_n</label>
        <input id="n" type="number" min="1" max="1000000" value="2">
      </div>
      <div>
        <label>Precision (coefficients, ≤ 600)</label>
        <input id="precision" type="number" min="2" max="600" value="24">
      </div>
    </div>
    <div style="margin-top:12px"><button id="go">Apply T_n</button></div>
    <div class="chips">
      <span class="chip" data-n="2">T₂ Δ — τ(2) = −24</span>
      <span class="chip" data-n="3">T₃ Δ</span>
      <span class="chip" data-n="11">T₁₁ Δ</span>
      <span class="chip" data-n="4">T₄ Δ (prime power)</span>
      <span class="chip" data-n="6">T₆ Δ (T₂T₃)</span>
    </div>
  </div>

  <div class="card" id="out" style="display:none">
    <div id="badges"></div>
    <div class="result" id="result"></div>
  </div>
  <div id="error"></div>
</div>

<script src="/vendor/katex.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const token = localStorage.getItem("bc_token");
if (!token) { $("gate").style.display = "block"; } else { $("lab").style.display = "block"; }

$("form").addEventListener("change", () => {
  $("weightBox").style.display = $("form").value === "eisenstein" ? "block" : "none";
});

function qexpLatex(coeffs, form, weight, n) {
  const name = form === "delta" ? "\\Delta" : `E_{${weight}}`;
  const lhs = n === 1 ? name : `T_{${n}}\\!\\left(${name}\\right)`;
  const terms = [];
  const shown = Math.min(coeffs.length, 24);
  for (let i = 1; i < shown; i++) {
    const a = coeffs[i];
    if (a === 0) continue;
    const sign = a < 0 ? " - " : (terms.length ? " + " : "");
    const mag = Math.abs(a);
    const coef = mag === 1 ? "" : String(mag);
    const qpart = i === 1 ? "q" : `q^{${i}}`;
    terms.push(sign + coef + qpart);
  }
  if (!terms.length) terms.push("0");
  const tail = coeffs.length > shown ? `\\;\\cdots` : "";
  return `${lhs} = ${terms.join("")}${tail}`;
}

function render(body) {
  $("out").style.display = "block";
  $("error").style.display = "none";
  const b = [];
  if (body.form === "delta" && body.n > 1) {
    b.push(`<span class="badge">Ramanujan τ(${body.n}) = <b>${body.eigenvalue}</b></span>`);
  }
  if (body.form === "eisenstein") {
    b.push(`<span class="badge">λ(T<sub>${body.n}</sub>) = σ<sub>${body.weight - 1}</sub>(${body.n}) = <b>${body.eigenvalue}</b> (eigenform: ${body.is_eigen})</span>`);
  } else if (body.eigenvalue !== null && body.eigenvalue !== undefined) {
    b.push(`<span class="badge">T<sub>${body.n}</sub>Δ = λΔ with λ = <b>${body.eigenvalue}</b></span>`);
  }
  b.push(`<span class="badge">trusted q-degree &lt; ${body.precision} <span class="muted">(input ${body.input_precision})</span></span>`);
  $("badges").innerHTML = b.join("");
  katex.render(qexpLatex(body.coefficients, body.form, body.weight, body.n), $("result"),
    { displayMode: true, throwOnError: false });
}

async function apply() {
  $("go").disabled = true;
  $("error").style.display = "none";
  try {
    const payload = {
      form: $("form").value,
      precision: parseInt($("precision").value, 10),
      n: parseInt($("n").value, 10),
    };
    if (payload.form === "eisenstein") payload.weight = parseInt($("weight").value, 10);
    const resp = await fetch("/api/math/hecke", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify(payload),
    });
    if (resp.status === 401) { $("gate").style.display = "block"; throw new Error("Not signed in"); }
    const body = await resp.json();
    if (!resp.ok) throw new Error(body.detail || JSON.stringify(body));
    render(body);
  } catch (err) {
    $("error").textContent = String(err.message || err);
    $("error").style.display = "block";
  } finally {
    $("go").disabled = false;
  }
}

$("go").addEventListener("click", apply);
document.querySelectorAll(".chip").forEach(chip =>
  chip.addEventListener("click", () => {
    $("form").value = "delta";
    $("weightBox").style.display = "none";
    $("n").value = chip.dataset.n;
    apply();
  }));

if (token) {
  // auto-run the classic demo so the page never opens empty
  apply();
}
</script>
</body>
</html>
