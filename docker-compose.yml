services:
  batch-chat:
    build: .
    container_name: batch-chat
    restart: unless-stopped
    env_file:
      - .env
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 & uvicorn app.main:app --host 0.0.0.0 --port 8443 --ssl-keyfile /lego/current.key --ssl-certfile /lego/current.crt & wait"
    ports:
      - "8000:8000"
      - "8443:8443"
      - "443:8443"
    volumes:
      - ./data:/app/data
      - ./certs:/certs:ro
      - ./.lego/certificates:/lego:ro