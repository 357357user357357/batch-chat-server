[package]
name = "graphkern"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CPU graph kernel for flexchat.top: CSR-based PageRank, Brandes betweenness, personalized PageRank (cugraph-style, no CUDA)"

[lib]
name = "graphkern"
crate-type = ["cdylib"]

[dependencies]
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
